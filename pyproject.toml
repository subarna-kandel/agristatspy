[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agristatspy"
version = "0.1.0"
description = "Agricultural experimental design and statistical analysis for Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "agriculture",
    "experimental-design",
    "statistics",
    "ANOVA",
    "CRD",
    "RCBD",
    "field-trials",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "openpyxl>=3.1",
]

[project.urls]
Repository = "https://github.com/agristatspy/agristatspy"

[tool.hatch.build.targets.wheel]
packages = ["src/agristatspy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
src = ["src"]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PT"]
ignore = ["E501"]
